<!DOCTYPE html>
<!-- lang is deliberately empty — the HTML spec's "language unknown". This one
     document serves every locale, and the language provider sets
     document.documentElement.lang from the resolved locale on mount.
     Hard-coding "en" made a Russian or Japanese page declare English until
     React took over, which is worse for assistive technology reading early
     than declaring nothing for that moment. Automated audits read the settled
     DOM, by which point the attribute holds the resolved locale, so this costs
     no html-has-lang result; it is only the pre-mount instant that goes from
     stating a wrong language to stating none. -->
<html lang="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Code Review</title>
  <meta name="description" content="The open source code review agent." />

  <!-- Open Graph / social preview (iMessage, WeChat, Slack, Facebook, ...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Open Code Review" />
  <meta property="og:url" content="https://open-codereview.ai/" />
  <meta property="og:title" content="Open Code Review" />
  <meta property="og:description" content="The open source code review agent." />
  <meta property="og:image" content="https://open-codereview.ai/og-image.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Open Code Review" />
  <meta name="twitter:description" content="The open source code review agent." />
  <meta name="twitter:image" content="https://open-codereview.ai/og-image.png" />

  <!-- Critical paint state, inlined because every rule in src/styles/index.css
       ships inside the deferred JS chunks (style-loader, no MiniCssExtractPlugin).
       Until the last chunk executes there is no stylesheet at all, so the browser
       paints its default white canvas. Colours must stay in sync with the `body`
       rule in src/styles/index.css so nothing shifts when the runtime CSS lands;
       src/index.html.test.ts asserts they still match. It is also the only
       stylesheet the document itself carries — nothing below links an external
       sheet, so no round-trip can get in front of the first paint. -->
  <style>
    html, body { margin: 0; background-color: #000000; color: #ffffff; }

    /* Boot indicator. Present only while #root has no children, so React mounting
       removes it with no JS teardown of our own. */
    #root:empty::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: ocr-boot-spin 0.8s linear infinite;
    }

    @keyframes ocr-boot-spin { to { transform: rotate(360deg); } }

    /* Still shows the ring, just without the motion. */
    @media (prefers-reduced-motion: reduce) {
      #root:empty::after { animation: none; }
    }
  </style>

  <link rel="icon" type="image/svg+xml" href="<%= require('./logo.svg') %>" />

  <!-- No third-party stylesheet is linked here, deliberately. This head used to
       pull a Google Fonts sheet (Inter + JetBrains Mono) and cdnjs Font Awesome,
       which cost two cross-origin round-trips on every route this template
       renders (index.html and the 404.html SPA fallback) and, wherever egress to
       those hosts is unavailable — an air-gapped install, a CI sandbox, a
       restrictive corporate network — failed with ERR_CONNECTION_REFUSED and
       logged two console errors on an otherwise silent page.
       They bought nothing in return. `body` in src/styles/index.css and
       `.docs-markdown` in src/styles/docs-markdown.css both set their own local
       stacks, so the Tailwind `sans`/`mono` theme entries reach only `html` and
       the `<pre>` wrappers, and none of those paint text of their own: not one
       glyph on any route was ever drawn in Inter or in JetBrains Mono. Every
       icon the site renders is a local SVG, so no element carried a Font Awesome
       class either. src/components/WhySection.tsx does still hold `fa-solid`
       classes and a `font-mono` paragraph, but it is unreferenced dead code —
       nothing imports it, the `why.*` translation keys it reads exist in no
       locale table, UseCasesSection supersedes it with local SVG icons, and it
       is tree-shaken out of every chunk. Wire it up again and it needs local
       icons first. Removing all of this leaves the render byte-identical, and
       the site now paints entirely from this document and the bundled chunks.
       Anything genuinely needed here must be self-hosted and bundled rather than
       linked from a CDN; src/index.html.test.ts fails the build if an absolute
       stylesheet URL, a preconnect hint or a <noscript> sheet comes back. -->
</head>
<body>
  <div id="root"></div>
</body>
</html>
